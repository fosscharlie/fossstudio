services:
  app:
    build: ./server
    restart: unless-stopped
    # Host networking: the media engine hands out many UDP ports (40000-40100)
    # and needs to see real client addresses; mapping them one-by-one is slower
    # and error-prone. The app itself binds only to 127.0.0.1.
    network_mode: host
    env_file: .env
    environment:
      DATA_DIR: /data
      WEB_DIR: /app/web
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ./web:/app/web:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4-alpine
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command: >
      --realm=${DOMAIN}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --no-cli
      --no-multicast-peers

volumes:
  caddy_data:
  caddy_config:
