<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOSSStudio session</title>
<link rel="stylesheet" href="/css/session.css?v=20260823a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#14161a">
</head>
<body>

<!-- Preview: pick devices and name before joining -->
<div id="preview" class="preview">
  <div class="preview-card">
    <h1 id="previewTitle">Ready to join?</h1>
    <div class="preview-video-wrap">
      <video id="previewVideo" autoplay playsinline muted></video>
      <div id="micMeter" class="mic-meter"><div id="micMeterFill"></div></div>
    </div>
    <div id="camRow">
      <label><span class="lab">Camera <span class="info">
        <button type="button" class="info-btn" aria-label="About the camera setting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></button>
        <span class="info-panel" role="tooltip">Which camera you appear on. If you have more than one plugged in, pick it here and check the preview above before you join.</span>
      </span></span>
        <select id="camSelect"></select>
      </label>
      <button type="button" id="mirrorBtn" class="small-btn iconish" aria-pressed="true" aria-label="Mirror my preview" data-tip="Mirror my preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="2 3"/><path d="M8 8L4 12l4 4M16 8l4 4-4 4"/></svg></button>
    </div>
    <label><span class="lab">Zoom <span id="zoomValue" class="soft">1.0×</span> <span class="info" data-side="left">
      <button type="button" class="info-btn" aria-label="About the zoom setting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></button>
      <span class="info-panel" role="tooltip">Crops in on your camera so you fill more of the frame. It changes how you look to everyone else, not the camera itself, so use it to sit better in your tile.</span>
    </span></span>
      <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1" aria-label="Camera zoom">
    </label>
    <label><span class="lab">Microphone <span class="info">
      <button type="button" class="info-btn" aria-label="About the microphone setting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></button>
      <span class="info-panel" role="tooltip">Which microphone picks up your voice. Say something and watch the level bar under the preview to check it is hearing you.</span>
    </span></span>
      <select id="micSelect"></select>
    </label>
    <div id="spkRow">
      <label><span class="lab">Speaker <span class="info" data-side="left">
        <button type="button" class="info-btn" aria-label="About the speaker setting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></button>
        <span class="info-panel" role="tooltip">Where you hear everyone else. Headphones are worth it: with speakers your microphone picks up the other voices and echoes them back to the room.</span>
      </span></span>
        <select id="spkSelect"></select>
      </label>
      <button type="button" id="spkTestBtn" class="small-btn">Play test sound</button>
    </div>
    <div id="bannerRow">
      <label><span class="lab">Banner title <span class="soft">(required - max 24 characters)</span> <span class="info">
        <button type="button" class="info-btn" aria-label="About the banner title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></button>
        <span class="info-panel" role="tooltip">The big line on the name banner under your video. Everyone in the session sees it, and it is baked into the recording and the stream. Usually your name, or your name and what you do.</span>
      </span></span>
        <input id="nameInput" maxlength="24" autocomplete="name" required>
      </label>
      <label><span class="lab">Banner subtitle <span class="soft">(optional - max 32 characters)</span> <span class="info" data-side="left">
        <button type="button" class="info-btn" aria-label="About the banner subtitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></button>
        <span class="info-panel" role="tooltip">The smaller line under it. A good place for anything you want the audience to have: your website, an email address, or a social handle.</span>
      </span></span>
        <input id="taglineInput" maxlength="32" autocomplete="off">
      </label>
    </div>
    <button id="joinBtn" disabled>Join session</button>
    <p id="previewError" class="error" hidden></p>
  </div>
</div>

<!-- Live session -->
<div id="session" class="session" hidden>
  <!-- Shown when the call connects but no media flows: without it the
       tiles just sit black and silent with nothing explaining why -->
  <div id="mediaWarning" class="media-warning" role="status" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
      <path d="M12 9v4M12 16.5h.01"/>
    </svg>
    <div>
      <b>Video and audio aren't getting through.</b>
      <span id="mediaWarningText"></span>
      <a id="mediaWarningLink" href="/diagnostics" target="_blank" rel="noopener" hidden>Run the setup check</a>
    </div>
    <button type="button" id="mediaWarningClose" class="media-warning-close" aria-label="Dismiss">✕</button>
  </div>
  <div class="session-body">
  <!-- Host-only: the channel page's chat, docked beside the show while
       live on the channel. The host talks under their banner name. -->
  <aside id="hostChat" class="host-chat" hidden>
    <div class="chat-head">Chat <span id="hostChatViewers" class="soft"></span></div>
    <div id="hostChatList" class="chat-list" aria-live="polite"></div>
    <form id="hostChatSend" class="send-box">
      <input id="hostChatInput" maxlength="500" placeholder="Say something…" autocomplete="off" aria-label="Message">
      <button type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button>
    </form>
  </aside>
  <main id="grid" class="grid">
    <!-- Episode logo + title block: floats over the video; the host
         can drag it anywhere and the compositors follow -->
    <header id="banner" class="banner">
      <img id="bannerLogo" alt="" hidden>
      <div id="bannerTitle"></div>
    </header>

    <!-- Host-only: right-click the logo/title block for its controls -->
    <div id="titleMenu" class="title-menu" hidden>
      <button type="button" id="tmBigger">Bigger</button>
      <button type="button" id="tmSmaller">Smaller</button>
      <hr>
      <div class="tm-label">Logo position</div>
      <button type="button" class="tm-layout" data-layout="left">Left of the title</button>
      <button type="button" class="tm-layout" data-layout="right">Right of the title</button>
      <button type="button" class="tm-layout" data-layout="top">Above the title</button>
      <button type="button" class="tm-layout" data-layout="bottom">Below the title</button>
      <hr>
      <button type="button" id="tmLogo">Hide logo</button>
      <button type="button" id="tmText">Hide title</button>
    </div>

    <!-- Soundboard: host-only thin strip across the bottom of the video -->
    <div id="soundBar" class="sound-bar" hidden>
      <div id="soundBarList" class="sound-bar-list"></div>
      <button id="soundBarClose" type="button" class="sound-bar-close" aria-label="Close soundboard">✕</button>
    </div>
  </main>

  <!-- Host-only control panel (always open for the host) -->
  <aside id="hostPanel" class="host-panel" hidden>
    <h2>Host controls</h2>
    <!-- Record and the two live outputs stacked full width: each shows
         its own elapsed clock while running, so they never shrink -->
    <div class="hp-stack">
      <div class="hp-stack-row">
        <button id="hpRecordBtn" class="hp-btn record">● Record</button>
        <button type="button" class="info-btn" id="hpRecordInfo" data-tip="Records the show: one combined video plus lossless audio per person, ready in the dashboard when you stop." aria-label="About recording"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></button>
      </div>
      <div class="hp-stack-row">
        <button id="hpLiveBtn" class="hp-btn record">Go live</button>
        <button type="button" class="info-btn" id="hpLiveInfo" data-tip="Go live on your channel page - video, chat and a saved copy, all on your own domain." aria-label="About going live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></button>
      </div>
      <div class="hp-stack-row">
        <button id="hpYtBtn" class="hp-btn record">YouTube</button>
        <button type="button" class="info-btn" id="hpYtInfo" data-tip="Also stream to YouTube - it needs the stream key from the dashboard, and can run alongside your channel page on one encode." aria-label="About the YouTube output"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></button>
      </div>
    </div>
    <div class="hp-row">
      <button id="hpServerRec" type="button" class="hp-btn hp-icon" data-tip="Recording in the browser (click for server recording - best for 2-3 guests)" aria-label="Recording mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg></button>
      <button id="hpAutoGain" class="hp-btn hp-icon" data-tip="Auto level" aria-label="Auto level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20v-6"/><path d="M6 10V4"/><path d="M12 20v-4"/><path d="M12 12V4"/><path d="M18 20v-9"/><path d="M18 7V4"/><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="14" r="1.7"/><circle cx="18" cy="9" r="1.7"/></svg></button>
      <button id="hpMuteAllBtn" class="hp-btn" data-tip="Mute everyone at once, including you">Mute all</button>
    </div>
    <div class="hp-row">
      <button id="hpSubBtn" class="hp-btn">Sub</button>
      <button id="hpAdBtn" class="hp-btn">Ad</button>
      <button type="button" class="info-btn" data-tip="Sub plays the subscribe-and-bell reminder over the show; Ad shows your advertising banner for about 18 seconds. Both appear for everyone - screen, stream and recording." aria-label="About Sub and Ad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></button>
    </div>
    <!-- Colours live behind two small buttons: guests' banners, and the
         logo/title block background -->
    <div class="hp-row">
      <button id="hpBannerColorsBtn" class="hp-btn">Banner colours</button>
      <button id="hpTitleColorsBtn" class="hp-btn">Title colour</button>
      <button type="button" class="info-btn" data-tip="Banner colours picks the colour of everyone's name banners; Title colour sets the background of the logo/title block. Each opens swatches and a hex box." aria-label="About the colour tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></button>
    </div>
    <!-- Both palettes share one layout: three rows of six, the hex box
         filling the right half of the third row -->
    <div id="hpBannerPop" class="hp-pop" hidden>
      <div class="hp-palette">
        <div id="hpBannerSwatches" style="display:contents"></div>
        <input type="text" id="hpBannerHex" class="hp-hex" maxlength="7" spellcheck="false" placeholder="#hex" aria-label="Banner colour hex code">
      </div>
      <div class="hp-row" style="margin-top:0.4rem; margin-bottom:0">
        <button id="hpBannerMulti" class="hp-btn" data-tip="Give every person a different colour">Random</button>
        <button id="hpBannerChoice" class="hp-btn" data-tip="Let guests pick their own colour from the palette">Guests choose</button>
      </div>
    </div>
    <div id="hpTitlePop" class="hp-pop" hidden>
      <div class="hp-palette">
        <div id="hpTitleSwatches" style="display:contents"></div>
        <input type="text" id="hpTitleHex" class="hp-hex" maxlength="7" spellcheck="false" placeholder="#hex" aria-label="Title block colour hex code">
      </div>
    </div>
    <hr class="hp-divider">
    <div id="hpGuests"></div>
    <hr class="hp-divider">
    <div class="hp-build">Build 20260808k</div>
  </aside>
  </div>
  <!-- Fullscreen intro video: takes over every screen while it plays -->
  <div id="introOverlay" class="intro-overlay" hidden>
    <video id="introVideo" class="intro-video" playsinline></video>
  </div>

  <footer class="controls">
    <div id="myColorPop" class="my-colors" hidden></div>
    <button id="myColorBtn" class="ctl" title="Pick your banner colour" aria-label="Pick your banner colour" hidden></button>
    <button id="recLight" type="button" class="ctl rec-light" data-tip="Recording light - lights up red when recording" aria-label="Recording light"></button>
    <button id="handBtn" class="ctl" title="I want to talk" aria-label="I want to talk"></button>
    <button id="muteBtn" class="ctl" title="Mute microphone" aria-label="Mute microphone"></button>
    <button id="camBtn" class="ctl" title="Turn camera off" aria-label="Turn camera off"></button>
    <button id="soundboardBtn" class="ctl" title="Soundboard" aria-label="Soundboard" hidden></button>
    <button id="dimBtn" class="ctl" title="Dim the controls" aria-label="Dim the controls"></button>
    <button id="leaveBtn" class="ctl leave" title="Leave session" aria-label="Leave session"></button>
  </footer>
</div>

<script src="/assets/mediasoup-client.js?v=20260807e"></script>
<script src="/js/session.js?v=20260823a"></script>
</body>
</html>
