<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOSSStudio session</title>
<link rel="stylesheet" href="/css/session.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#14161a">
</head>
<body>

<!-- Preview: pick devices and name before joining -->
<div id="preview" class="preview">
  <div class="preview-card">
    <h1 id="previewTitle">Ready to join?</h1>
    <div class="preview-video-wrap">
      <video id="previewVideo" autoplay playsinline muted></video>
      <div id="micMeter" class="mic-meter"><div id="micMeterFill"></div></div>
    </div>
    <label>Camera
      <select id="camSelect"></select>
    </label>
    <label>Zoom <span id="zoomValue" class="soft">1.0×</span>
      <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1" aria-label="Camera zoom">
    </label>
    <label>Microphone
      <select id="micSelect"></select>
    </label>
    <div id="spkRow">
      <label>Speaker
        <select id="spkSelect"></select>
      </label>
      <button type="button" id="spkTestBtn" class="small-btn">Play test sound</button>
    </div>
    <label>Noise suppression
      <select id="noiseSelect">
        <option value="rnnoise" selected>On — filters fans, hums, keyboards</option>
        <option value="off">Off — send my microphone untouched</option>
      </select>
    </label>
    <label class="check">
      <input type="checkbox" id="mirrorToggle" checked>
      Mirror my preview
    </label>
    <label>Banner title <span class="soft">(required)</span>
      <input id="nameInput" maxlength="40" autocomplete="name" required>
    </label>
    <label>Banner subtitle <span class="soft">(optional)</span>
      <input id="taglineInput" maxlength="60" autocomplete="off">
    </label>
    <button id="joinBtn" disabled>Join session</button>
    <p id="previewError" class="error" hidden></p>
  </div>
</div>

<!-- Live session -->
<div id="session" class="session" hidden>
  <header id="banner" class="banner">FOSSStudio</header>
  <main id="grid" class="grid"></main>
  <footer class="controls">
    <button id="muteBtn" class="ctl" title="Mute microphone" aria-label="Mute microphone">🎙️</button>
    <button id="camBtn" class="ctl" title="Turn camera off" aria-label="Turn camera off">🎥</button>
    <button id="hostPanelBtn" class="ctl" title="Host controls" aria-label="Host controls" hidden>🎛️</button>
    <button id="leaveBtn" class="ctl leave" title="Leave session" aria-label="Leave session">✕</button>
  </footer>

  <!-- Host-only control panel -->
  <aside id="hostPanel" class="host-panel" hidden>
    <h2>Host controls</h2>
    <label class="hp-toggle" id="hpServerRecRow" hidden>
      <input type="checkbox" id="hpServerRec">
      <span>Server-side recording <span class="hp-vol">(this session)</span></span>
    </label>
    <div class="hp-row">
      <button id="hpRecordBtn" class="hp-btn record">● Start recording</button>
      <button id="hpStreamBtn" class="hp-btn record">📡 Go live</button>
    </div>
    <div class="hp-row">
      <button id="hpGridBtn" class="hp-btn">Grid layout</button>
      <button id="hpSpotSelfBtn" class="hp-btn">Spotlight me</button>
    </div>
    <div class="hp-row">
      <button id="hpMuteAllBtn" class="hp-btn">🔇 Mute everyone</button>
    </div>
    <label class="hp-toggle">
      <input type="checkbox" id="hpAutoGain">
      <span>Auto level balancing</span>
    </label>
    <div id="hpGuests"></div>
  </aside>
</div>

<script src="/assets/mediasoup-client.js"></script>
<script src="/js/session.js"></script>
</body>
</html>
